name: Synchroniser les actualités Facebook

on:
  schedule:
    - cron: "17 5 * * *"      # chaque jour à 05h17 UTC
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: facebook-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire la Page Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 scripts/sync_facebook.py
      - name: Enregistrer les changements
        run: |
          git config user.name  "uck-sync"
          git config user.email "uck-sync@users.noreply.github.com"
          git add news.json media
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "Actualités : mise à jour automatique depuis Facebook"
            git push
          fi

